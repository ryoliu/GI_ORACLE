# ============================================================
# Oracle GI / ASM / Database Installation Configuration
# Personal LAB Environment
# ============================================================

# ------------------------------------------------------------
# Environment
# ------------------------------------------------------------
ENVIRONMENT="PERSONAL_LAB"
OS_FAMILY="Oracle Linux"
OS_MAJOR_VERSION="9"

# ------------------------------------------------------------
# Host
# ------------------------------------------------------------
HOST_NAME="CHANGE_ME"

# ------------------------------------------------------------
# Oracle Inventory
# ------------------------------------------------------------
ORA_INVENTORY="/opt/oraInventory"
OINSTALL_GROUP="oinstall"

# ------------------------------------------------------------
# Oracle Base
# ------------------------------------------------------------
ORACLE_BASE="/opt/oracle"

# ------------------------------------------------------------
# Grid Infrastructure
# ------------------------------------------------------------
GRID_OWNER="grid"
GRID_PRIMARY_GROUP="oinstall"

GRID_BASE="/opt/grid"
GRID_HOME="/opt/19.3.0.0/grid"

GI_SOFTWARE="/software/LINUX.X64_193000_grid_home.zip"

# Optional in personal LAB environment.
# Leave empty when RU or OPatch is not available.
GI_RU=""
GI_OPATCH=""

# ------------------------------------------------------------
# ASM OS Groups
# ------------------------------------------------------------
ASM_OSDBA_GROUP="asmdba"
ASM_OSOPER_GROUP="asmoper"
ASM_OSASM_GROUP="asmadmin"

# ------------------------------------------------------------
# ASM
# ------------------------------------------------------------
ASM_DISCOVERY_STRING="/dev/oracleasm/disks/*"

ASM_DISKGROUP_DATA="DATA"
ASM_DISKGROUP_DATA_REDUNDANCY="EXTERNAL"
ASM_DISKGROUP_DATA_DISKS="/dev/oracleasm/disks/DATA01"

ASM_DISKGROUP_FRA="FRA"
ASM_DISKGROUP_FRA_REDUNDANCY="EXTERNAL"
ASM_DISKGROUP_FRA_DISKS="/dev/oracleasm/disks/FRA01"

# ------------------------------------------------------------
# Oracle Database Software
# ------------------------------------------------------------
ORACLE_OWNER="oracle"
ORACLE_PRIMARY_GROUP="oinstall"

DB_OSDBA_GROUP="dba"
DB_OSOPER_GROUP="oper"

DB_HOME="/opt/oracle/product/19.3.0.0/db_1"

DB_SOFTWARE="/software/LINUX.X64_193000_db_home.zip"

# Optional in personal LAB environment.
# Leave empty when RU or OPatch is not available.
DB_RU=""
DB_OPATCH=""

# ------------------------------------------------------------
# Database
# ------------------------------------------------------------
DB_NAME="ORCL"
DB_UNIQUE_NAME="ORCL"
ORACLE_SID="ORCL"

DB_CHARACTERSET="AL32UTF8"

DB_STORAGE_TYPE="ASM"
DB_DATA_DISKGROUP="+DATA"
DB_FRA_DISKGROUP="+FRA"
DB_FRA_SIZE_MB="8192"

DB_MEMORY_MB="2048"

# ------------------------------------------------------------
# Listener
# ------------------------------------------------------------
LISTENER_NAME="LISTENER"
LISTENER_PORT="1521"

# ------------------------------------------------------------
# Database Configuration
# ------------------------------------------------------------
ARCHIVELOG="YES"

DB_PROCESSES="300"
AUDIT_TRAIL="DB,EXTENDED"

# ------------------------------------------------------------
# EM Express
# ------------------------------------------------------------
EM_EXPRESS_PORT="5500"
